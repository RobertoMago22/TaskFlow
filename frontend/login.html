
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Login</title>
    <link rel="stylesheet" href="auth.css">
    <script src="login.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <span class="logo-icon">T</span>
                <span>TaskFlow</span>
            </div>

            <h1>Bem-vindo de volta!</h1>
            <p class="subtitle">Entre para acessar suas tarefas.</p>

            <form id="formLogin" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email"
                           placeholder="seu@email.com"
                           autocomplete="username">
                    <small id="erroEmail" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha"
                            placeholder="Sua senha"
                            autocomplete="current-password">
                        <button type="button" id="mostrarSenha">Mostrar</button>
                    </div>
                    <small id="erroSenha" class="error"></small>
                </div>

                <p id="mensagem" class="feedback" role="status"
                   aria-live="polite" hidden></p>

                <button type="submit" id="btnLogin">Entrar</button>
            </form>

            <p class="auth-footer">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </main>
</body>
</html>
