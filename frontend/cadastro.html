
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Criar conta</title>
    <link rel="stylesheet" href="auth.css">
    <script src="cadastro.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <span class="logo-icon">T</span>
                <span>TaskFlow</span>
            </div>

            <h1>Crie sua conta</h1>
            <p class="subtitle">Cadastre-se para organizar suas tarefas.</p>

            <form id="formCadastro" novalidate>
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" maxlength="100"
                           placeholder="Seu nome" autocomplete="name">
                    <small id="erroNome" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email"
                           placeholder="seu@email.com"
                           autocomplete="email">
                    <small id="erroEmail" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha"
                            placeholder="Mínimo de 8 caracteres"
                            autocomplete="new-password">
                        <button type="button" id="mostrarSenha"> Mostrar</button>
                    </div>
                    <small id="erroSenha" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <div class="campo-senha">
                        <input type="password" id="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password">
                        <button type="button" id="mostrarConfirmarSenha"> Mostrar</button>
                    </div>
                    <small id="erroConfirmarSenha" class="error"></small>
                </div>

                <p id="mensagem" class="feedback" role="status"
                   aria-live="polite" hidden></p>

                <button type="submit" id="btnCadastrar">
                    Criar conta
                </button>
            </form>

            <p class="auth-footer">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </div>
    </main>
</body>
</html>
